# Dataset paths of one computer.
# Copy this file to conf/machine/local.yaml and set your own paths. Git ignores the copy,
# and the code uses it when it exists. Keep only the keys your experiment configs use;
# conf/machine/liverpool-hpc.yaml shows the full list.
paths:
  datasets:
    processed_405_background_256: "/path/to/processed/Friday/405_background_256"
    processed_405_realbeam_random_256: "/path/to/processed/Friday/405_realbeam_random_256"
    processed_405_realbeam_raster_256: "/path/to/processed/Friday/405_realbeam_raster_256"
    processed_405_stimuation_large_256: "/path/to/processed/Friday/405_stimuation_large_256"
    processed_405_realbeam_eval_256: "/path/to/processed/Friday/405_realbeam_eval_256"

    processed_690_background_256: "/path/to/processed/Thursday/690_background_256"
    processed_690_reflection_large_256: "/path/to/processed/Thursday/690_reflection_large_256"
    processed_690_reflection_small_256: "/path/to/processed/Thursday/690_reflection_small_256"
    processed_690_realbeam_256: "/path/to/processed/Thursday/690_realbeam_256"

    processed_670_background_256: "/path/to/processed/Wednesday/670_background_256"
    processed_670_large_256: "/path/to/processed/Wednesday/670_large_256"
    processed_670_realbeam_256: "/path/to/processed/Wednesday/670_realbeam_256"

    processed_520_background_256: "/path/to/processed/Wednesday/520_background_256"
    processed_520_stimulation_large_256: "/path/to/processed/Wednesday/520_stimulation_large_256"
    processed_520_realbeam_256: "/path/to/processed/Wednesday/520_realbeam_256"

