# ====================
# CLEAR 2026 520 nm reconstruction - cam1 input, cam2 target
# Friday-small cam1 port of CLEAR26_520_cam3_v3, calibrated on 2026-08-11.
# Pipeline topology and training hyperparameters are inherited unchanged.
#
# 2026-08-11 CALIBRATION (see skills/calibration.md).
#   Eval set: shared 405_realbeam_eval_256 cam1->cam2 ROI>=0.80, 438 pairs.
#   Basis:    520_stimulation_small_256 ROI>=0.75, 4069 eligible pairs;
#             seed-42 random cap to exactly 3000 before CachedBasisPipeline.
#   Pattern:  all 438 eval-query pairs, supplied unsplit to the real prior.
#   Acquisition contract matches across the 520 basis/background and shared
#   eval data: 10 ms exposure, cam1 gain 1.0, cam2 gain 0.3, same camera ROI.
#
#   Measured (probe 1, normalizer) on bg-subtracted eval counts:
#     cam1 p50 403.7  p99.5 1435.6  max 1520.0  -> current_max 1600
#     cam2 p50 478.8  p99.5  797.8  max  881.7  -> current_max  900
#   Measured (probe 2, sensor noise) over all 438 cam1 eval frames, 0..960:
#     var = 0.214 * signal + 2.17 (R^2 0.974), count_scale 1600.
#
#   Measured (probe 3) over 8 batches before L2 after the final prior:
#     torch_scale input 0.966 -> energy 3670.8/3661.0 (synth/real = 1.00)
#     torch_scale target 0.871 -> energy 1514.6/1508.0 (synth/real = 1.00)
#     downstream clipping 0% in both slots (256 synthetic / 219 real).
#
#   Measured (probe 4) in final L2 x16 target space. Full 5000-sample
#   60/40 mixed stream vs all 438 real eval targets (means):
#                     peak   sigma_x  sigma_y  radius  footprint
#     real eval       .439     .113     .104    .266      .100
#     mixed train     .452     .106     .099    .266      .096
#   The p5-p95 intervals overlap for all five marginals; empty rate is 0%.
#   The 0.43 center-radius prior corrects the edge coverage while retaining
#   the measured mildly eccentric round core+halo morphology.
# Run with: EXPERIMENT_CONFIG=CLEAR26_520_cam1_Friday_v3
# ====================

seed: &seed 42
name: &config "CLEAR26_520_cam1_Friday_v3.yaml"
framework: "pytorch"
file_extract: False
note: |
  Calibrated 520 nm cam1-input port. Train on the Friday
  520_stimulation_small_256 basis, cam1 fiber -> cam2 screen, and evaluate on
  the shared Friday 405_realbeam_eval_256 set. Input and target remain
  L2-normalized per sample.
  Beam-prior mixing remains 60/40 and uses all ROI>=0.80 evaluation-query
  targets as the unsplit real-pattern prior.

paths:
  output: ${paths.output_root}
  processed_520_background: ${paths.datasets.processed_520_background_friday_256}
  processed_520_stimulation_small: ${paths.datasets.processed_520_stimulation_small_256}
  processed_405_realbeam_eval_256: ${paths.datasets.processed_405_realbeam_eval_256}

model:
  name: "CAE"
  in_channels: 1
  out_channels: 1
  kernel_size: 4
  encoder:          [64,   128, 128, 256, 512, 1024]
  decoder:          [1024, 512, 256, 128, 128, 64  ]
  apply_batchnorm:  [0,    1,   1,   1,   1,   1   ]
  # Dropout setting inherited unchanged from CLEAR26_520_cam3_v3.
  apply_dropout:    [0,    0,   0,   0,   0,   0   ]
  final_activation: sigmoid

sql:
  clear26_520_cam1_to_cam2_basis: |
    SELECT
      a.png_path || '|' || b.png_path AS image_pair,
      a.sample_id,
      a.run_id
    FROM images a
    JOIN images b
      ON a.sample_id = b.sample_id
     AND a.run_id = b.run_id
    WHERE a.camera = 'cam1'
      AND b.camera = 'cam2'
      AND a.png_path IS NOT NULL
      AND b.png_path IS NOT NULL
      AND a.stat_max > 0
      AND a.stat_sum > 0
      AND b.roi_energy_fraction >= 0.75
      AND abs(a.sync_time_ns - b.sync_time_ns) <= 1000000
    ORDER BY a.run_id, a.sample_id;

  clear26_520_cam1_to_cam2_eval: |
    SELECT
      a.png_path || '|' || b.png_path AS image_pair,
      a.sample_id,
      a.run_id
    FROM images a
    JOIN images b
      ON a.sample_id = b.sample_id
     AND a.run_id = b.run_id
    WHERE a.camera = 'cam1'
      AND b.camera = 'cam2'
      AND a.png_path IS NOT NULL
      AND b.png_path IS NOT NULL
      AND a.stat_max > 0
      AND a.stat_sum > 0
      AND b.roi_energy_fraction >= 0.80
      AND abs(a.sync_time_ns - b.sync_time_ns) <= 1000000
    ORDER BY a.run_id, a.sample_id;

simulation:
  canvas_size: [256, 256]
  # The 520 cam2 targets are near-round; use concentric round core/halo
  # components instead of the horizontally aligned 670 nm prior.
  total_Guassian_num: 2
  max_pixel_value: 1.0
  max_intensity: 0.10   # Legacy fallback; intensity_range is active below.
  area_boost_scale: 0.0
  max_peak_intensity: null
  minimum_pixel_threshold: 0.0
  fade_rate: 0.10
  std_1: 0.045
  std_2: 0.055
  distribution: "other"
  intensity_range: [0.060, 0.100]
  aspect_range: [1.0, 1.20]
  # The mildly eccentric real targets have a broad, weak horizontal tendency.
  orientation_range: [-55.0, 40.0]
  # Raised from 0.34: final mixed radius mean 0.266 matches real 0.266.
  center_radius_range: [0.0, 0.430]
  shared_center: true
  component_params:
    - {}
    - std_1: 0.090
      std_2: 0.150
      aspect_range: [1.0, 1.20]
      intensity_range: [0.0060, 0.0120]
      area_boost_scale: 0.0
  process_functions:
    - name: "resize"
      params:
        size: [34, 34]
        interpolation: "area"
    - name: "shrink_to_canvas"
      params:
        scale: 0.95
        fill: 0.0
        interpolation: "area"

# Validator intentionally absent. The strictly positive intensity_range
# already prevents the degenerate near-empty samples that normalization
# would amplify; a validator would add an unprobed rejection-selection effect.

training:
  # Inherited from 690 v3: 250-epoch cap with patience-20 early stopping.
  epochs: &epochs 250
  learning_rate: 1.0e-4
  batch_size: &batch 32

callbacks:
  - name: "torch_batch_progress_bar"
    params:
      only_keys: ["train_loss", "val_loss"]
  - name: "torch_early_stopping"
    params:
      monitor: "val_loss"
      patience: 20
  - name: "torch_image_reconstruction_callback"
    params:
      save_dir: ${paths.output}
      include_training_images: True

dataset_structure:
  db: "dataset.db"

data:
  pipeline_case: spatial_nearest_combinator
  dataset_sources: ["processed_520_stimulation_small", "processed_405_realbeam_eval_256"]
  train_sql_key: clear26_520_cam1_to_cam2_basis
  eval_sql_key: clear26_520_cam1_to_cam2_eval
  # Independent provider: all eval-query targets feed the prior without splitting.
  pattern_sql_key: clear26_520_cam1_to_cam2_eval
  # Seeded random sampling is applied before the eager basis cache is built.
  max_basis_samples: 3000
  provider_output_column: image_pair
  total_train_samples: 5000
  val_test_split: 0.5
  input_shape: &inp [256, 256]
  output_shape: &out [256, 256]
  transforms:
    torch:
      - name: "split_text"
        params:
          separator: "|"
      - name: "multi_transform"
        params:
          transforms:
            - name: "add_parent_dir"
            - name: "add_parent_dir"
      - name: "multi_transform"
        params:
          transforms:
            - name: "load_image16"
            - name: "load_image16"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_to_tensor"
            - name: "torch_to_tensor"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_520_background}
                camera: "cam1"
                clip_min: 0.0
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_520_background}
                camera: "cam2"
                clip_min: 0.0
      # Count normalizers measured for Friday cam1->cam2 on 2026-08-11.
      # IMPORTANT: this data.transforms chain is ALSO the basis-caching
      # chain (utils.py extends it with basis_transforms). It must contain
      # NO per-sample normalization - basis frames enter the combinator in
      # calibrated raw units so mixture weighting, the reflection field's
      # spatial nonuniformity, and the sensor-noise count mapping stay
      # physical. Per-sample normalization lives in combinator.transforms
      # (train) and eval_extra_transforms (eval) ONLY.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 1600.0
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 900.0
  # v2: appended ONLY to the eval/val/test chain by the utils.py hook -
  # mirrors combinator.transforms so train and eval live in the same
  # normalized space. Both slots are torch tensors here.
  eval_extra_transforms:
    torch:
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_l2_normalize"
            - name: "torch_l2_normalize"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 24.0
            - name: "torch_scale"
              params:
                scale_factor: 16.0
  basis_transforms:
    torch:
      - name: "multi_transform"
        params:
          transforms:
            - null
            - name: "torch_render_centroid_kernel"
              params:
                sigma: 8.0
      # 2026-08-11 final probe-3 measurements (8 batches):
      #   input  3670.8 synthetic / 3661.0 real = 1.00
      #   target 1514.6 synthetic / 1508.0 real = 1.00
      # Downstream clipping was 0% in both slots.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 0.966
            - name: "torch_scale"
              params:
                scale_factor: 0.871
  dataset_ops:
    - name: "torch_batch"
      params:
        batch_size: *batch
        shuffle: True
        num_workers: 0
        prefetch_factor: 2
        seed: *seed

combinator:
  jitter_mode: global_cell
  jitter_alpha: 1.0
  generation_batch_size: *batch
  clip_output: [0.0, 1.0]
  transforms:
    torch:
      # Physical order: sensor noise in counts FIRST, then normalization.
      - name: "multi_transform"
        params:
          transforms:
            # 2026-08-11 probe-2 fit over all 438 cam1 eval frames.
            # param_jitter 2.0 adds deliberate factor-two domain randomization.
            - name: "torch_sensor_noise"
              params:
                a: 0.214
                b: 2.17
                count_scale: 1600.0
                param_jitter: 2.0
                gain: null
                clip_min: 0.0
            - null
      # v2 per-sample normalization. Type note: input slot receives a torch
      # tensor (from torch_sensor_noise) -> torch_l2_normalize; target slot
      # receives numpy from the combinator -> numpy 'l2_normalize'.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_l2_normalize"
            - name: "l2_normalize"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 24.0
            - name: "torch_scale"
              params:
                scale_factor: 16.0

image_generator:
  cache_transformed: true
  transforms:
    - name: "split_text"
      params:
        separator: "|"
    - name: "tuple_select"
      params:
        index: 1
    - name: "add_parent_dir"
    - name: "load_image"
    - name: "to_narray"
    - name: "to_grayscale"
    - name: "subtract_background"
      params:
        background_source: ${paths.processed_520_background}
        camera: "cam2"
        clip_min: 0.0
    - name: "resize"
      params:
        size: [34, 34]
        interpolation: "area"
    - name: "remap_range"
      params:
        current_min: 0.0
        current_max: 4095.0
        target_min: 0.0
        target_max: 1.0
    - name: "shrink_to_canvas"
      params:
        scale: 1.0
        fill: 0.0
        interpolation: "bilinear"

weighted_stream:
  real_weight: 0.6
  sgm_weight: 0.4

extra_files: ["models/CAE.py"]
