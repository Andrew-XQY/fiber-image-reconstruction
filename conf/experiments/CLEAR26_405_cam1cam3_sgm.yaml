# CLEAR 2026 reconstruction: cam1 + cam3 (both fibres) as a 2-channel input, cam2 target.
# SGM coefficient maps combine a measured stimulation basis recorded on all three
# cameras at once, so one coefficient map drives both fibre channels.
# The real-pattern stream is disabled. Per-camera calibration is taken unchanged
# from CLEAR26_405_cam1_sgm.yaml (cam1, cam2) and CLEAR26_405_cam3_sgm.yaml (cam3).
# Slot order is cam1 | cam2 | cam3 so the target stays slot 1 (centroid positions,
# image_generator); torch_cat_slots packs slots 0 and 2 into the model input.

seed: &seed 42
name: &config "CLEAR26_405_cam1cam3_sgm.yaml"
framework: "pytorch"
file_extract: False
note: |
  Reconstruct cam2 screen images from both fibres: cam1 and cam3 images stacked as two input channels.
  SGM coefficient maps over a measured three-camera stimulation basis; the real-pattern stream is disabled.

paths:
  output: ${paths.output_root}
  processed_405_background: ${paths.datasets.processed_405_background_256}
  processed_405_realbeam_random: ${paths.datasets.processed_405_realbeam_random_256}
  processed_405_realbeam_raster: ${paths.datasets.processed_405_realbeam_raster_256}
  processed_405_stimuation_large: ${paths.datasets.processed_405_stimuation_large_256}
  processed_405_realbeam_eval_256: ${paths.datasets.processed_405_realbeam_eval_256}

model:
  name: "CAE"
  in_channels: 2
  out_channels: 1
  kernel_size: 4
  encoder:          [64,   128, 128, 256, 512, 1024]
  decoder:          [1024, 512, 256, 128, 128, 64  ]
  apply_batchnorm:  [0,    1,   1,   1,   1,   1   ]

  apply_dropout:    [0,    0,   0,   0,   0,   0   ]
  final_activation: sigmoid

sql:
  # Triplets: cam1 (a) | cam2 (b) | cam3 (c), both fibres within 1 ms of the target frame.
  clear26_cam1cam3_to_cam2_basis: |
    SELECT
      a.png_path || '|' || b.png_path || '|' || c.png_path AS image_pair,
      a.sample_id,
      a.run_id
    FROM images a
    JOIN images b
      ON a.sample_id = b.sample_id
     AND a.run_id = b.run_id
    JOIN images c
      ON a.sample_id = c.sample_id
     AND a.run_id = c.run_id
    WHERE a.camera = 'cam1'
      AND b.camera = 'cam2'
      AND c.camera = 'cam3'
      AND a.png_path IS NOT NULL
      AND b.png_path IS NOT NULL
      AND c.png_path IS NOT NULL
      AND c.stat_max > 0
      AND c.stat_sum > 0
      AND b.roi_energy_fraction >= 0.75
      AND abs(a.sync_time_ns - b.sync_time_ns) <= 1000000
      AND abs(c.sync_time_ns - b.sync_time_ns) <= 1000000
    ORDER BY a.sample_id;

  clear26_cam1cam3_to_cam2_eval: |
    SELECT
      a.png_path || '|' || b.png_path || '|' || c.png_path AS image_pair,
      a.sample_id,
      a.run_id
    FROM images a
    JOIN images b
      ON a.sample_id = b.sample_id
     AND a.run_id = b.run_id
    JOIN images c
      ON a.sample_id = c.sample_id
     AND a.run_id = c.run_id
    WHERE a.camera = 'cam1'
      AND b.camera = 'cam2'
      AND c.camera = 'cam3'
      AND a.png_path IS NOT NULL
      AND b.png_path IS NOT NULL
      AND c.png_path IS NOT NULL
      AND c.stat_max > 0
      AND c.stat_sum > 0
      AND b.roi_energy_fraction >= 0.9
      AND abs(a.sync_time_ns - b.sync_time_ns) <= 1000000
      AND abs(c.sync_time_ns - b.sync_time_ns) <= 1000000
    ORDER BY a.sample_id;

simulation:
  canvas_size: [256, 256]
  # SGM prior fitted to measured evaluation-target marginals: width,
  # centroid radius, peak intensity, and footprint. Explicit intensity,
  # radius, and aspect ranges replace the fallback sampler settings.
  total_Guassian_num: 1
  max_pixel_value: 1.0
  max_intensity: 0.02        # ignored while intensity_range is set (fallback)
  area_boost_scale: 0.0      # Disable the additional amplitude boost.
  max_peak_intensity: null
  minimum_pixel_threshold: 0.02
  fade_rate: 0.02            # ignored while intensity_range is set (fallback)
  std_1: 0.06
  std_2: 0.11
  distribution: "other"
  # Coefficient amplitudes were calibrated before rendering, whose measured
  # amplitude gain was about 4.5. The earlier [0.30, 0.75] coefficient range
  # saturated rendered targets at clip=1.
  intensity_range: [0.07, 0.16]
  center_radius_range: [0.0, 0.39]
  aspect_range: [0.7, 1.55]
  process_functions:
    - name: "resize"
      params:
        size: [34, 34]
        interpolation: "area"
    - name: "shrink_to_canvas"
      params:
        scale: 1.0    # Full canvas scale.
        fill: 0.0
        interpolation: "area"

# Optional rendered-target rejection sampling; disabled in this configuration.
sgm_validator:
  enabled: false
  peak_range: [0.20, 0.90]
  footprint_range: [0.05, 0.20]
  footprint_threshold: 0.05
  centroid_radius_max: 0.42
  max_retries: 20

training:
  epochs: &epochs 100
  learning_rate: 1.0e-4
  batch_size: &batch 32

callbacks:
  - name: "torch_batch_progress_bar"
    params:
      only_keys: ["train_loss", "val_loss"]
  - name: "torch_early_stopping"
    params:
      monitor: "val_loss"
      patience: 20
  - name: "torch_image_reconstruction_callback"
    params:
      save_dir: ${paths.output}
      include_training_images: True

dataset_structure:
  db: "dataset.db"

data:
  pipeline_case: spatial_nearest_combinator
  dataset_sources: ["processed_405_stimuation_large", "processed_405_realbeam_eval_256"]
  train_sql_key: clear26_cam1cam3_to_cam2_basis
  eval_sql_key: clear26_cam1cam3_to_cam2_eval
  pattern_sql_key: clear26_cam1cam3_to_cam2_basis
  provider_output_column: image_pair
  total_train_samples: 5000
  val_test_split: 0.5
  input_shape: &inp [256, 256]
  output_shape: &out [256, 256]
  # Every slot list below is (cam1, cam2, cam3).
  transforms:
    torch:
      - name: "split_text"
        params:
          separator: "|"
      - name: "multi_transform"
        params:
          transforms:
            - name: "add_parent_dir"
            - name: "add_parent_dir"
            - name: "add_parent_dir"
      # load_image16 returns 16-bit integer counts with shape (1, H, W)
      # and rejects 8-bit source images.
      - name: "multi_transform"
        params:
          transforms:
            - name: "load_image16"
            - name: "load_image16"
            - name: "load_image16"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_to_tensor"
            - name: "torch_to_tensor"
            - name: "torch_to_tensor"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_405_background}
                camera: "cam1"
                clip_min: 0.0
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_405_background}
                camera: "cam2"
                clip_min: 0.0
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_405_background}
                camera: "cam3"
                clip_min: 0.0
      # Fixed count normalizers from background-subtracted evaluation peak p99.5
      # plus margin: cam1 1600, cam2 900, cam3 2100. Basis values may exceed 1;
      # clipping is applied after combination.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 1600.0
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 900.0
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 2100.0
  # Evaluation only: pack the two fibre slots into one (2, H, W) input.
  eval_extra_transforms:
    torch:
      - name: "torch_cat_slots"
        params:
          slots: [0, 2]
  basis_transforms:
    torch:
      # Replace basis target spots with energy-preserving Gaussian kernels at
      # their centroids. The fibre slots pass through unchanged.
      - name: "multi_transform"
        params:
          transforms:
            - null
            - name: "torch_render_centroid_kernel"
              params:
                sigma: 4.0
            - null
      # Scale factors use the measured cam1/cam2/cam3 calibration
      # (0.26 / 0.26 / 0.28, as in the single-fibre configs).
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 0.26
            - name: "torch_scale"
              params:
                scale_factor: 0.26
            - name: "torch_scale"
              params:
                scale_factor: 0.28
  dataset_ops:
    - name: "torch_batch"
      params:
        batch_size: *batch
        shuffle: True
        num_workers: 0
        prefetch_factor: 2
        seed: *seed

combinator:
  jitter_mode: global_cell
  jitter_alpha: 1.0
  generation_batch_size: *batch
  clip_output: [0.0, 1.0]
  transforms:
    torch:
      # Per-fibre sensor noise from the measured spatial noise-gap fits:
      # cam1 a=0.106, b=2.81, count_scale=1600; cam3 a=0.118, b=4.82,
      # count_scale=2100. The target slot is clipped only.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_sensor_noise"
              params:
                a: 0.106
                b: 2.81
                count_scale: 1600.0
                param_jitter: 2.0
                gain: null
                clip_min: 0.0
            - name: "torch_clip_range"
              params:
                clip_min: 0.0
                clip_max: 1.0
            - name: "torch_sensor_noise"
              params:
                a: 0.118
                b: 4.82
                count_scale: 2100.0
                param_jitter: 2.0
                gain: null
                clip_min: 0.0
      # Pack the two fibre slots into one (2, H, W) input; the target follows.
      - name: "torch_cat_slots"
        params:
          slots: [0, 2]

image_generator:
  cache_transformed: true
  transforms:
    - name: "split_text"
      params:
        separator: "|"
    - name: "tuple_select"
      params:
        index: 1
    - name: "add_parent_dir"
    - name: "load_image"
    - name: "to_narray"
    - name: "to_grayscale"
    - name: "subtract_background"
      params:
        background_source: ${paths.processed_405_background}
        camera: "cam2"
        clip_min: 0.0
    - name: "resize"
      params:
        size: [34, 34]
        interpolation: "area"
    - name: "remap_range"
      params:
        current_min: 0.0
        current_max: 4095.0
        target_min: 0.0
        target_max: 1.0
    - name: "shrink_to_canvas"
      params:
        scale: 1.0
        fill: 0.0
        interpolation: "bilinear"

weighted_stream:
  real_weight: 0.0
  sgm_weight: 1.0

extra_files: ["models/CAE.py"]
