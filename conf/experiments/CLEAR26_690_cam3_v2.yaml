# CLEAR 2026, 690 nm reflection: cam3 input, cam2 target.
# Per-sample L2 normalization follows combination and count-domain noise;
# the evaluation chain applies the same normalization. Basis caching
# preserves calibrated count units. Real/SGM pattern weights are 70/30;
# real coefficient maps use all ROI>=0.80 evaluation-query targets.
# Count calibration: 2026-07-22; basis-scale recalibration: 2026-07-23.

seed: &seed 42
name: &config "CLEAR26_690_cam3_v2.yaml"
framework: "pytorch"
file_extract: False
note: |
  Reconstruct cam3 fiber images as cam2 screen images using a measured reflection basis.
  Training combines the basis with 70% real-target coefficient maps from the unsplit evaluation database and 30% SGM maps.

paths:
  output: ${paths.output_root}
  processed_690_background: ${paths.datasets.processed_690_background_256}
  processed_690_reflection_large: ${paths.datasets.processed_690_reflection_large_256}
  processed_690_realbeam_256: ${paths.datasets.processed_690_realbeam_256}

model:
  name: "CAE"
  in_channels: 1
  out_channels: 1
  kernel_size: 4
  encoder:          [64,   128, 128, 256, 512, 1024]
  decoder:          [1024, 512, 256, 128, 128, 64  ]
  apply_batchnorm:  [0,    1,   1,   1,   1,   1   ]
  # Dropout disabled for the reflection-input ablation.
  apply_dropout:    [0,    0,   0,   0,   0,   0   ]
  final_activation: sigmoid

sql:
  clear26_690_cam3_to_cam2_basis: |
    SELECT
      a.png_path || '|' || b.png_path AS image_pair,
      a.sample_id,
      a.run_id
    FROM images a
    JOIN images b
      ON a.sample_id = b.sample_id
     AND a.run_id = b.run_id
    WHERE a.camera = 'cam3'
      AND b.camera = 'cam2'
      AND a.png_path IS NOT NULL
      AND b.png_path IS NOT NULL
      AND a.stat_max > 0
      AND a.stat_sum > 0
      AND b.roi_energy_fraction >= 0.55
      AND abs(a.sync_time_ns - b.sync_time_ns) <= 1000000
    ORDER BY a.sample_id;

  clear26_690_cam3_to_cam2_eval: |
    SELECT
      a.png_path || '|' || b.png_path AS image_pair,
      a.sample_id,
      a.run_id
    FROM images a
    JOIN images b
      ON a.sample_id = b.sample_id
     AND a.run_id = b.run_id
    WHERE a.camera = 'cam3'
      AND b.camera = 'cam2'
      AND a.png_path IS NOT NULL
      AND b.png_path IS NOT NULL
      AND a.stat_max > 0
      AND a.stat_sum > 0
      AND b.roi_energy_fraction >= 0.80
      AND abs(a.sync_time_ns - b.sync_time_ns) <= 1000000
    ORDER BY a.sample_id;

simulation:
  canvas_size: [256, 256]
  total_Guassian_num: 3
  max_pixel_value: 1.0
  max_intensity: 0.018
  area_boost_scale: 0.000352941176470588
  max_peak_intensity: null
  minimum_pixel_threshold: 0.02
  fade_rate: 0.10
  std_1: 0.05
  std_2: 0.10
  distribution: "other"
  # Strictly positive intensities keep all Gaussian components active and
  # reduce near-empty coefficient maps before per-sample normalization.
  intensity_range: [0.004, 0.018]
  process_functions:
    - name: "resize"
      params:
        size: [34, 34]
        interpolation: "area"
    - name: "shrink_to_canvas"
      params:
        scale: 0.95
        fill: 0.0
        interpolation: "area"

# No rejection validator is enabled. Coefficient intensities are strictly positive.

training:
  # Early stopping uses patience 20 within the 250-epoch cap.
  epochs: &epochs 250
  learning_rate: 1.0e-4
  batch_size: &batch 32

callbacks:
  - name: "torch_batch_progress_bar"
    params:
      only_keys: ["train_loss", "val_loss"]
  - name: "torch_early_stopping"
    params:
      monitor: "val_loss"
      patience: 20
  - name: "torch_image_reconstruction_callback"
    params:
      save_dir: ${paths.output}
      include_training_images: True

dataset_structure:
  db: "dataset.db"

data:
  pipeline_case: spatial_nearest_combinator
  dataset_sources: ["processed_690_reflection_large", "processed_690_realbeam_256"]
  train_sql_key: clear26_690_cam3_to_cam2_basis
  eval_sql_key: clear26_690_cam3_to_cam2_eval
  # Coefficient maps come from the unsplit evaluation database.
  pattern_sql_key: clear26_690_cam3_to_cam2_eval
  provider_output_column: image_pair
  total_train_samples: 5000
  val_test_split: 0.5
  input_shape: &inp [256, 256]
  output_shape: &out [256, 256]
  transforms:
    torch:
      - name: "split_text"
        params:
          separator: "|"
      - name: "multi_transform"
        params:
          transforms:
            - name: "add_parent_dir"
            - name: "add_parent_dir"
      - name: "multi_transform"
        params:
          transforms:
            - name: "load_image16"
            - name: "load_image16"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_to_tensor"
            - name: "torch_to_tensor"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_690_background}
                camera: "cam3"
                clip_min: 0.0
            - name: "torch_subtract_background"
              params:
                background_source: ${paths.processed_690_background}
                camera: "cam2"
                clip_min: 0.0
      # Fixed count normalizers are calibrated on evaluation images.
      # This chain also builds the basis cache: preserve calibrated count units
      # here. Per-sample normalization follows combination for training and is
      # applied separately in eval_extra_transforms for evaluation.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 2200.0
            - name: "torch_remap_range"
              params:
                current_min: 0.0
                current_max: 500.0
  # Evaluation-only normalization mirrors the generated training samples.
  # Both evaluation slots are torch tensors.
  eval_extra_transforms:
    torch:
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_l2_normalize"
            - name: "torch_l2_normalize"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 24.0
            - name: "torch_scale"
              params:
                scale_factor: 16.0
  basis_transforms:
    torch:
      - name: "multi_transform"
        params:
          transforms:
            - null
            - name: "torch_render_centroid_kernel"
              params:
                sigma: 8.0
      # Basis scales were fitted against pre-normalization evaluation energies.
      # Apply these before count-domain sensor noise and per-sample L2 normalization.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 0.31
            - name: "torch_scale"
              params:
                scale_factor: 1.18
  dataset_ops:
    - name: "torch_batch"
      params:
        batch_size: *batch
        shuffle: True
        num_workers: 0
        prefetch_factor: 2
        seed: *seed

combinator:
  jitter_mode: global_cell
  jitter_alpha: 1.0
  generation_batch_size: *batch
  clip_output: [0.0, 1.0]
  transforms:
    torch:
      # Apply sensor noise in count units before per-sample normalization.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_sensor_noise"
              params:
                a: 0.118
                b: 4.82
                count_scale: 2200.0
                param_jitter: 2.0
                gain: null
                clip_min: 0.0
            - null
      # The input is a torch tensor after sensor-noise injection; the target
      # is a NumPy array. Use the matching L2 transform for each slot.
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_l2_normalize"
            - name: "l2_normalize"
      - name: "multi_transform"
        params:
          transforms:
            - name: "torch_scale"
              params:
                scale_factor: 24.0
            - name: "torch_scale"
              params:
                scale_factor: 16.0

image_generator:
  cache_transformed: true
  transforms:
    - name: "split_text"
      params:
        separator: "|"
    - name: "tuple_select"
      params:
        index: 1
    - name: "add_parent_dir"
    - name: "load_image"
    - name: "to_narray"
    - name: "to_grayscale"
    - name: "subtract_background"
      params:
        background_source: ${paths.processed_690_background}
        camera: "cam2"
        clip_min: 0.0
    - name: "resize"
      params:
        size: [34, 34]
        interpolation: "area"
    - name: "remap_range"
      params:
        current_min: 0.0
        current_max: 4095.0
        target_min: 0.0
        target_max: 1.0
    - name: "shrink_to_canvas"
      params:
        scale: 1.0
        fill: 0.0
        interpolation: "bilinear"

weighted_stream:
  real_weight: 0.7
  sgm_weight: 0.3

extra_files: ["models/CAE.py"]
